- name: Install basic tools
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - tree
      - ufw
    state: present
    update_cache: true

- name: Add devops_admin
  ansible.builtin.user:
    name: devops_admin
    state: present
    create_home: true
    groups: sudo
    append: true
    shell: /bin/bash

- name: Install controlnode's public key
  ansible.posix.authorized_key:
    user: devops_admin
    key: "{{ lookup('file', '~/.ssh/devops_admin.pub') }}"
    state: present

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow mDNS
  community.general.ufw:
    rule: allow
    port: "5353"
    proto: udp

- name: Deny other incoming traffic and enable the firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
