---
# tasks file for roles/db
- name: Database is installed
  ansible.builtin.apt:
    name: mariadb-server
    state: present

- name: Python mysql module is installed
  ansible.builtin.apt:
    name: python3-pymysql
    state: present

- name: Database service is started and enabled
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Create user and authenticate with secret in mysql
  ansible.mysql.mysql_user:
    name: "{{ db_user }}"
    host: "%"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:SELECT,INSERT"
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Listen on all addresses
  ansible.builtin.copy:
    dest: /etc/mysql/mariadb.conf.d/99-bind.cnf
    content: |
      [mysqld]
      bind-address = 0.0.0.0
    mode: "0644"
  notify: Restart mariadb

- name: App database exists
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Table with data
  ansible.mysql.mysql_query:
    login_db: "{{ db_name }}"
    login_unix_socket: /run/mysqld/mysqld.sock
    query:
      - CREATE TABLE IF NOT EXISTS messages (id INT PRIMARY KEY, text VARCHAR(100))
      - INSERT IGNORE INTO messages VALUES (1, 'Hello from MariaDB on node2!')
