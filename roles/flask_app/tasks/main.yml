---
# tasks file for roles/flask_app
- name: Install flask
  ansible.builtin.apt:
    name:
      - python3-pymysql
      - python3-flask
      - gunicorn
    state: present

- name: Create app dir
  ansible.builtin.file:
    path: /opt/app
    state: directory
    mode: "0755"

- name: Deploy the app environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/app.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart app

- name: Systemd service for the app
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    mode: "0644"
  notify: Restart app

- name: Python app
  ansible.builtin.copy:
    src: app.py
    dest: /opt/app/app.py
    owner: root
    group: root
    mode: "0644"
  notify: Restart app

- name: Systemd app handle
  ansible.builtin.systemd:
    name: app
    state: started
    enabled: true
    daemon_reload: true
