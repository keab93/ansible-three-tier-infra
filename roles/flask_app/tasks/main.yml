---
# tasks file for roles/flask_app
- name: Install flask
  ansible.builtin.apt:
    name:
      - python3-pymysql
      - python3-flask
      - gunicorn
    state: present

- name: Create app dir
  ansible.builtin.file:
    path: /opt/app
    state: directory
    mode: "0755"

- name: Systemd service for the app
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    mode: "0644"
  notify: Restart app

- name: Python app
  ansible.builtin.template:
    src: app.py.j2
    owner: www-data
    dest: /opt/app/app.py
    mode: '0600'
  notify: Restart app

- name: Systemd app handle
  ansible.builtin.systemd:
    name: app
    state: started
    enabled: true
    daemon_reload: true
