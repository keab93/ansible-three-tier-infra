# tasks file for roles/webserver
- name: Nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Deploy index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"
  notify: Restart nginx

- name: Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
