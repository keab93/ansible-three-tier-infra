- name: Base config for all servers
  hosts: all
  become: true
  roles:
    - common

- name: Database tier
  hosts: dbservers
  become: true
  pre_tasks:
    - name: Gather facts from the web servers
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['webservers'] }}"
  roles:
    - db

- name: Web tier
  hosts: webservers
  become: true
  roles:
    - webserver
    - flask_app
